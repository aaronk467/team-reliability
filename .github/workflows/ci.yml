name: Verify statistics, reproducibility, and browser workflows
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Known-answer statistics, API contracts, and dataset reproducibility
        run: pytest -q
      - name: Regenerate demonstration files outside checkout and verify exact bytes
        run: |
          python datasets/generate.py --output-dir "$RUNNER_TEMP/responsewatch-datasets"
          diff datasets/stable.csv "$RUNNER_TEMP/responsewatch-datasets/stable.csv"
          diff datasets/south_shift.csv "$RUNNER_TEMP/responsewatch-datasets/south_shift.csv"
          diff datasets/improvement.csv "$RUNNER_TEMP/responsewatch-datasets/improvement.csv"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React/Vite frontend from locked dependencies
        run: |
          npm ci
          npm run build
        working-directory: frontend
      - name: Install pinned browser test tools
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Exercise the built app in Chromium
        run: |
          python -m uvicorn responsewatch.api:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/responsewatch-api.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2) as response:
                      assert response.status == 200
                  break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(1)
          else:
              raise SystemExit('Application did not become healthy')
          PY
          python scripts/browser_smoke.py --url http://127.0.0.1:8000 --browser auto
      - name: Preserve API log if verification failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsewatch-api-log
          path: ${{ runner.temp }}/responsewatch-api.log
          if-no-files-found: ignore
